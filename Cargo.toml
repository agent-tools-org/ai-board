[package]
name = "ai-board"
version = "0.2.1"
edition = "2024"
description = "AI engineering backlog manager — persistent task board for AI agents with human oversight dashboard"
license = "MIT"
repository = "https://github.com/agent-tools-org/ai-board"
homepage = "https://github.com/agent-tools-org/ai-board"
keywords = ["ai", "backlog", "task-board", "mcp", "agents"]
categories = ["command-line-utilities", "development-tools"]
default-run = "ai-board"

[[bin]]
name = "ai-board"
path = "src/main.rs"

[dependencies]
# Web
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Embedded web assets
rust-embed = "8"

# Utilities
anyhow = "1"
async-stream = "0.3"
futures-core = "0.3"
rmcp = { version = "0.1", features = ["server", "transport-io"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
